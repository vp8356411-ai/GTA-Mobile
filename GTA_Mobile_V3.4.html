<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#101a28">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GTA Mobile">
<title>GTA Mobile — V3.4</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{--glass:#101a28dd;--line:#ffffff38;--cyan:#8ee6ff}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10151d;color:#fff;font-family:Arial,sans-serif;touch-action:none}
#game{position:absolute;inset:0}canvas{display:block;width:100%;height:100%}
#top{position:absolute;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:2}
.logo{font-weight:900;letter-spacing:1px;text-shadow:0 2px 8px #000;font-size:18px}.logo small{display:block;font-size:10px;color:var(--cyan);letter-spacing:2px;margin-top:3px}
#hint{background:#0009;padding:9px 11px;border-radius:10px;font-size:11px;line-height:1.45;max-width:54%;text-align:right}
#menu{position:absolute;right:10px;top:82px;display:flex;gap:6px;flex-direction:column;z-index:3}
button{border:1px solid var(--line);background:var(--glass);color:#fff;border-radius:11px;padding:10px 12px;font-weight:bold;cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-size:13px}
button:active{transform:scale(.97);background:#24405b}
#panel{display:none;position:absolute;inset:0;background:#000b;align-items:center;justify-content:center;padding:18px;z-index:10;touch-action:auto}
.card{width:min(460px,100%);max-height:min(78dvh,680px);overflow:auto;background:#172231;border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 20px 70px #000}
.card h2{margin:0 0 14px;font-size:20px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.choice{padding:12px;text-align:left;min-height:60px}.choice span{display:block;color:#aab8c9;font-size:11px;margin-top:5px;font-weight:normal;line-height:1.3}
#controls{position:absolute;bottom:max(14px,env(safe-area-inset-bottom));left:12px;right:12px;display:flex;justify-content:space-between;align-items:end;pointer-events:none;z-index:2}
.pad{display:grid;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(2,44px);gap:5px;pointer-events:auto}
.pad button,.action button{background:#101a28bb;touch-action:none;user-select:none;-webkit-user-select:none}
.pad button{font-size:18px;padding:0}.action{display:flex;gap:7px;pointer-events:auto}.action button{min-width:62px;min-height:53px;padding:8px 9px}
#toast{position:absolute;bottom:125px;left:50%;transform:translateX(-50%);background:#000d;padding:10px 14px;border-radius:10px;font-size:13px;display:none;white-space:nowrap;z-index:12;max-width:90%;text-align:center}
#speed{position:absolute;left:14px;top:88px;background:#0008;border-radius:9px;padding:7px 10px;font-size:12px;display:none;z-index:2}
#minimap{position:absolute;left:12px;top:132px;width:116px;height:116px;border:1px solid #ffffff70;border-radius:13px;background:#101a28cc;z-index:2;box-shadow:0 4px 18px #0008;pointer-events:none}
@media(max-width:430px){#minimap{width:104px;height:104px;top:128px}}
@media(max-width:430px){#menu{top:78px}#menu button{padding:8px 9px;font-size:11px}.logo{font-size:16px}.logo small{font-size:9px}.pad{grid-template-columns:repeat(3,43px);grid-template-rows:repeat(2,41px)}.action button{min-width:56px;min-height:49px;font-size:11px}}
</style>
</head>
<body>
<div id="game"></div>
<div id="top">
 <div class="logo">GTA MOBILE<small>OPEN WORLD • MOBILE EDITION V3.4</small></div>
 <div id="hint">▲▼◀▶ — движение<br>Е / Войти — сесть или выйти<br>Машины: 7 моделей</div>
</div>
<div id="speed">0 км/ч</div>
<canvas id="minimap" width="240" height="240" aria-label="Мини-карта города"></canvas>
<div id="menu">
 <button onclick="openPanel('garage')">🛠 Гараж</button>
 <button onclick="openPanel('cars')">🚘 Автопарк</button>
 <button onclick="openPanel('maps')">🗺 Карты</button>
 <button onclick="openPanel('skins')">👕 Скины</button>
 <button onclick="openPanel('mods')">⚙ Моды</button>
 <button onclick="openPanel('settings')">🎮 Настройки</button>
</div>
<div id="panel"><div class="card"><h2 id="panelTitle">Меню</h2><div class="choices" id="choices"></div><p style="color:#9eacbd;font-size:12px;margin:14px 0 0">GTA Mobile V3.4 • Прогресс и настройки сохраняются на устройстве.</p><p style="text-align:right;margin-bottom:0"><button onclick="closePanel()">Закрыть</button></p></div></div>
<div id="controls">
 <div class="pad">
  <span></span><button data-key="arrowup">▲</button><span></span>
  <button data-key="arrowleft">◀</button><button data-key="arrowdown">▼</button><button data-key="arrowright">▶</button>
 </div>
 <div class="action"><button id="enterBtn">Войти<br>Е</button><button id="jumpBtn">Прыжок</button></div>
</div>
<div id="toast"></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const root=document.querySelector('#game');
const scene=new THREE.Scene();
const skyColors=[0x91b8d0,0xe8a46d,0x17243e];
let currentMap=0;
scene.background=new THREE.Color(skyColors[0]);
scene.fog=new THREE.Fog(skyColors[0],55,190);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,500);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.35));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.12;
root.appendChild(renderer.domElement);

let quality=localStorage.getItem('gtaQuality')||'high';
function toast(t){const el=document.querySelector('#toast');el.textContent=t;el.style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.style.display='none',1800)}
function applyQuality(q,notify=true){
 quality=q;localStorage.setItem('gtaQuality',q);
 const cfg={low:{pixel:.8,shadows:false,fog:125},high:{pixel:1.25,shadows:true,fog:190},ultra:{pixel:1.6,shadows:true,fog:240}}[q]||{pixel:1.25,shadows:true,fog:190};
 renderer.setPixelRatio(Math.min(devicePixelRatio,cfg.pixel));renderer.shadowMap.enabled=cfg.shadows;scene.fog.far=cfg.fog;renderer.setSize(innerWidth,innerHeight);
 if(notify)toast('Графика: '+({low:'экономная',high:'высокая',ultra:'максимальная'}[q]));
}
scene.add(new THREE.HemisphereLight(0xd9edff,0x48505a,2.0));
const sun=new THREE.DirectionalLight(0xfff0d7,2.25);sun.position.set(-35,60,25);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);
const mats={
 road:new THREE.MeshStandardMaterial({color:0x303740,roughness:.95}),
 side:new THREE.MeshStandardMaterial({color:0x777d7e}),
 grass:new THREE.MeshStandardMaterial({color:0x547b4b}),
 white:new THREE.MeshStandardMaterial({color:0xe7e4d8}),
 glass:new THREE.MeshStandardMaterial({color:0x263f51,metalness:.3,roughness:.2}),
 black:new THREE.MeshStandardMaterial({color:0x15191d}),
 skin:new THREE.MeshStandardMaterial({color:0xd5a27b}),
 shirt:new THREE.MeshStandardMaterial({color:0x17191d}),
 pants:new THREE.MeshStandardMaterial({color:0x11151a})
};
const floor=new THREE.Mesh(new THREE.PlaneGeometry(260,260),mats.grass);floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
function box(w,h,d,mat,x,y,z,parent=scene){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m}
function road(x,z,w,d){
 box(w,.12,d,mats.road,x,.02,z);
 if(w>d){for(let i=-Math.floor(w/10);i<=Math.floor(w/10);i++)box(3,.025,.18,mats.white,x+i*10,.09,z)}
 else{for(let i=-Math.floor(d/10);i<=Math.floor(d/10);i++)box(.18,.025,3,mats.white,x,.09,z+i*10)}
}
road(0,0,230,16);road(0,0,16,230);road(0,55,230,12);road(55,0,12,230);
const buildingMats=[0x9b9a91,0x777f89,0xc2b8a2,0x687c82,0x9a7770].map(c=>new THREE.MeshStandardMaterial({color:c,roughness:.9}));
// Детализация фасадов собрана в InstancedMesh: меньше отдельных объектов и draw calls.
const windowMat=new THREE.MeshStandardMaterial({color:0x9dd6e7,emissive:0x18313c,roughness:.35});
const trimMat=new THREE.MeshStandardMaterial({color:0xd0c9b8,roughness:.8});
const doorMat=new THREE.MeshStandardMaterial({color:0x303b43,metalness:.25,roughness:.55});
const acMat=new THREE.MeshStandardMaterial({color:0xc3c8c8,metalness:.15,roughness:.7});
const roofMat=new THREE.MeshStandardMaterial({color:0x555d61,roughness:.95});
const unitBox=new THREE.BoxGeometry(1,1,1);
const maxWindows=6000,maxDetails=1200;
const windowFrames=new THREE.InstancedMesh(unitBox,trimMat,maxWindows);
const windowPanes=new THREE.InstancedMesh(unitBox,windowMat,maxWindows);
const entranceDoors=new THREE.InstancedMesh(unitBox,doorMat,maxDetails);
const airConditioners=new THREE.InstancedMesh(unitBox,acMat,maxDetails);
const roofDetails=new THREE.InstancedMesh(unitBox,roofMat,maxDetails);
const balconyDetails=new THREE.InstancedMesh(unitBox,new THREE.MeshStandardMaterial({color:0x9ba5a8,metalness:.55,roughness:.4}),maxDetails);
const dummy=new THREE.Object3D();
let frameCount=0,paneCount=0,doorCount=0,acCount=0,roofCount=0,balconyCount=0,buildingIndex=0;
function addInstance(mesh,position,scale,rotationY=0){
 dummy.position.set(position[0],position[1],position[2]);
 dummy.rotation.set(0,rotationY,0);dummy.scale.set(scale[0],scale[1],scale[2]);dummy.updateMatrix();
 const index=mesh===windowFrames?frameCount++:mesh===windowPanes?paneCount++:mesh===entranceDoors?doorCount++:mesh===airConditioners?acCount++:mesh===roofDetails?roofCount++:balconyCount++;
 mesh.setMatrixAt(index,dummy.matrix);
}
for(let x=-96;x<=96;x+=22)for(let z=-96;z<=96;z+=22){
 if(Math.abs(x)<13||Math.abs(z)<13||Math.abs(x-55)<10||Math.abs(z-55)<10)continue;
 const h=8+Math.random()*24,w=10+Math.random()*5,d=10+Math.random()*5;
 const facade=buildingMats[Math.floor(Math.random()*buildingMats.length)];
 box(w,h,d,facade,x,h/2,z);
 // Окна на четырёх сторонах: рамы и стёкла используют общие инстансы.
 for(let y=3;y<h-2;y+=4){
  for(let sx=-w/2+1.8;sx<w/2-1;sx+=3){
   addInstance(windowFrames,[x+sx,y,z+d/2+.055],[1.42,1.72,.07]);
   addInstance(windowPanes,[x+sx,y,z+d/2+.105],[1.2,1.5,.075]);
   addInstance(windowFrames,[x+sx,y,z-d/2-.055],[1.42,1.72,.07],Math.PI);
   addInstance(windowPanes,[x+sx,y,z-d/2-.105],[1.2,1.5,.075],Math.PI);
  }
  for(let sz=-d/2+1.8;sz<d/2-1;sz+=3){
   addInstance(windowFrames,[x+w/2+.055,y,z+sz],[1.42,1.72,.07],Math.PI/2);
   addInstance(windowPanes,[x+w/2+.105,y,z+sz],[1.2,1.5,.075],Math.PI/2);
   addInstance(windowFrames,[x-w/2-.055,y,z+sz],[1.42,1.72,.07],-Math.PI/2);
   addInstance(windowPanes,[x-w/2-.105,y,z+sz],[1.2,1.5,.075],-Math.PI/2);
  }
 }
 // Вход и козырёк.
 addInstance(entranceDoors,[x,1.2,z+d/2+.12],[1.65,2.35,.12]);
 addInstance(roofDetails,[x,2.45,z+d/2+.35],[2.15,.16,.85]);
 // Кондиционеры — только на части фасадов, чтобы не перегружать сцену.
 if(buildingIndex%2===0){
  for(let y=4;y<h-2;y+=8){
   const ax=x-w/2+2.1;
   addInstance(airConditioners,[ax,y,z+d/2+.32],[.82,.48,.42]);
  }
 }
 // Небольшие балконы на части домов.
 if(buildingIndex%3===0&&h>13){
  const bx=x+w/2+.42,by=Math.min(7,h-3);
  addInstance(balconyDetails,[bx,by,z],[.9,.13,2.5]);
  addInstance(balconyDetails,[bx+.43,by+.48,z],[.08,.85,2.5]);
  for(const zz of [-1.05,-.35,.35,1.05])addInstance(balconyDetails,[bx+.43,by+.45,z+zz],[.07,.8,.07]);
 }
 // Парапет крыши: четыре инстанса вместо отдельных Mesh.
 addInstance(roofDetails,[x,h+.18,z+d/2],[w+.25,.42,.22]);
 addInstance(roofDetails,[x,h+.18,z-d/2],[w+.25,.42,.22]);
 addInstance(roofDetails,[x+w/2,h+.18,z],[.22,.42,d]);
 addInstance(roofDetails,[x-w/2,h+.18,z],[.22,.42,d]);
 if(buildingIndex%4===0){
  addInstance(roofDetails,[x-w*.18,h+.72,z-d*.12],[2.1,1.25,1.8]);
  addInstance(airConditioners,[x+w*.2,h+.38,z+d*.18],[.55,.55,.55]);
 }
 buildingIndex++;
}
for(const [mesh,count] of [[windowFrames,frameCount],[windowPanes,paneCount],[entranceDoors,doorCount],[airConditioners,acCount],[roofDetails,roofCount],[balconyDetails,balconyCount]]){
 mesh.count=count;mesh.instanceMatrix.needsUpdate=true;mesh.computeBoundingSphere();scene.add(mesh);
}
for(let i=-100;i<=100;i+=10){if(Math.abs(i)<10)continue;box(.16,.2,1.1,mats.white,i,.13,8);box(1.1,.2,.16,mats.white,8,.13,i)}

// Персонаж в тёмном спортивном костюме
const player=new THREE.Group();scene.add(player);
const torso=new THREE.Mesh(new THREE.CylinderGeometry(.42,.48,1.15,10),mats.shirt);torso.position.y=1.35;torso.castShadow=true;player.add(torso);
const head=new THREE.Mesh(new THREE.SphereGeometry(.32,14,12),mats.skin);head.position.y=2.15;head.castShadow=true;player.add(head);
const hair=new THREE.Mesh(new THREE.SphereGeometry(.325,14,8,0,Math.PI*2,0,Math.PI/2),mats.black);hair.position.y=2.31;player.add(hair);
const beard=new THREE.Mesh(new THREE.SphereGeometry(.19,10,8),mats.black);beard.scale.set(1,.55,.8);beard.position.set(0,1.98,.18);player.add(beard);
for(const s of [-1,1]){
 const leg=new THREE.Mesh(new THREE.BoxGeometry(.25,.75,.3),mats.pants);leg.position.set(s*.2,.42,0);player.add(leg);
 const arm=new THREE.Mesh(new THREE.BoxGeometry(.2,.78,.24),mats.shirt);arm.position.set(s*.49,1.38,0);arm.rotation.z=s*.08;player.add(arm);
}
player.position.set(-4,0,-5);

// Машины и гараж
const vehicleDefs=[
 {name:'BMW',type:'Спортивный седан',color:0x2866b7,length:4.45,width:2.05,roof:1.35,cabin:1.95},
 {name:'Mercedes',type:'Премиальный купе',color:0x777f8b,length:4.55,width:2.08,roof:1.32,cabin:1.9},
 {name:'Lada',type:'Классика',color:0xd4d5d1,length:4.0,width:1.82,roof:1.42,cabin:2.0},
 {name:'Toyota',type:'Городской спорткар',color:0xc72e2e,length:4.25,width:1.95,roof:1.3,cabin:1.85},
 {name:'Nissan',type:'Японское купе',color:0x1d8c83,length:4.35,width:2.0,roof:1.28,cabin:1.75},
 {name:'Porsche',type:'Низкий спорткар',color:0xd6a52b,length:4.1,width:2.0,roof:1.22,cabin:1.55},
 {name:'Lamborghini',type:'Суперкар',color:0x9dbd28,length:4.5,width:2.12,roof:1.18,cabin:1.55}
];
let selectedVehicle=0,inCar=false,speed=0;
let garage={model:0,color:vehicleDefs[0].color,rim:0xb8c1ca,ride:0};
try{garage={...garage,...JSON.parse(localStorage.getItem('gtaWebGarage')||'{}')};if(Number.isInteger(garage.selectedVehicle))selectedVehicle=Math.max(0,Math.min(6,garage.selectedVehicle));}catch(e){}
const car=new THREE.Group();scene.add(car);car.position.set(4,0,-7);
const paint=new THREE.MeshStandardMaterial({color:0xc52c28,metalness:.55,roughness:.28});
let wheels=[],wheelPivots=[];
function buildVehicle(){
 while(car.children.length)car.remove(car.children[0]);wheels=[];wheelPivots=[];
 const v=vehicleDefs[selectedVehicle],L=v.length,W=v.width;paint.color.setHex(garage.color);
 box(W,.62,L,paint,0,.73+garage.ride*.2,0,car);
 box(W*.78,v.roof,v.cabin,mats.glass,0,1.34+garage.ride*.2,-.12,car);
 const dark=new THREE.MeshStandardMaterial({color:0x171b20,metalness:.35,roughness:.45});
 const chrome=new THREE.MeshStandardMaterial({color:0xc5ccd2,metalness:.85,roughness:.2});
 const lamp=new THREE.MeshStandardMaterial({color:0xeaf6ff,emissive:0x7b9cac,emissiveIntensity:.35});
 const redLamp=new THREE.MeshStandardMaterial({color:0xc51f24,emissive:0x500000});
 const frontZ=L/2+.04;
 box(W*.34,.2,.07,selectedVehicle===0?chrome:dark,0,.72+garage.ride*.2,frontZ,car);
 for(const side of [-1,1]){
  box(W*.2,.16,.08,lamp,side*W*.34,.86+garage.ride*.2,frontZ,car);
  box(W*.2,.16,.08,redLamp,side*W*.34,.86+garage.ride*.2,-L/2-.04,car);
 }
 box(W*1.02,.16,.22,chrome,0,.48+garage.ride*.2,L/2,car);
 box(W*1.02,.16,.22,chrome,0,.48+garage.ride*.2,-L/2,car);
 for(const x of [-W*.53,W*.53])for(const z of [-L*.31,L*.31]){
  const pivot=new THREE.Group();pivot.position.set(x,.4+garage.ride*.2,z);car.add(pivot);
  const wh=new THREE.Mesh(new THREE.CylinderGeometry(.39,.39,.27,20),mats.black);wh.rotation.z=Math.PI/2;wh.castShadow=true;pivot.add(wh);
  const rim=new THREE.Mesh(new THREE.CylinderGeometry(.23,.23,.29,14),new THREE.MeshStandardMaterial({color:garage.rim,metalness:.85,roughness:.2}));rim.rotation.z=Math.PI/2;pivot.add(rim);
  wheels.push(pivot);
 }
}
function applyGarage(){buildVehicle()}
function saveGarage(){try{localStorage.setItem('gtaWebGarage',JSON.stringify({...garage,selectedVehicle}));toast('Машина и тюнинг сохранены!')}catch(e){toast('Не удалось сохранить настройки')}}
buildVehicle();

// Движущийся городской трафик
const traffic=[];
const trafficColors=[0x2567b8,0xc43a32,0xe1d7bd,0x20242b,0x2c8b68,0xb58a32];
function makeTrafficCar(x,z,dir,color){
 const g=new THREE.Group(),mat=new THREE.MeshStandardMaterial({color,metalness:.25,roughness:.45});
 box(1.65,.5,3.1,mat,0,.58,0,g);box(1.25,.65,1.45,mats.glass,0,1.12,-.12,g);
 for(const sx of [-.83,.83])for(const sz of [-1,1]){
  const wh=new THREE.Mesh(new THREE.CylinderGeometry(.25,.25,.16,12),mats.black);wh.rotation.z=Math.PI/2;wh.position.set(sx,.3,sz*1.0);g.add(wh);
 }
 g.position.set(x,0,z);g.rotation.y=dir;scene.add(g);traffic.push({g,dir,axis:Math.abs(Math.sin(dir))>.5?'x':'z',sign:Math.cos(dir)>=0?1:-1,base:Math.abs(Math.sin(dir))>.5?z:x,offset:Math.abs(Math.sin(dir))>.5?x:z});
}
for(let i=0;i<7;i++){makeTrafficCar(-95+i*29,4,Math.PI/2,trafficColors[i%trafficColors.length]);makeTrafficCar(4,-95+i*29,0,trafficColors[(i+2)%trafficColors.length]);}

// Пешеходы: лёгкие геометрические модели с простыми маршрутами
const pedestrians=[];
const pedestrianClothes=[0x315c91,0x8d3d35,0x47734c,0x4d465f,0xb18a42,0x333b43];
function makePedestrian(x,z,axis,sign,colorIndex){
 const g=new THREE.Group(),cloth=new THREE.MeshStandardMaterial({color:pedestrianClothes[colorIndex%pedestrianClothes.length]}),skinMat=new THREE.MeshStandardMaterial({color:0xc99570}),darkMat=new THREE.MeshStandardMaterial({color:0x202329});
 box(.38,.68,.24,cloth,0,1.05,0,g);
 const head=new THREE.Mesh(new THREE.SphereGeometry(.17,8,7),skinMat);head.position.y=1.52;g.add(head);
 box(.18,.58,.2,darkMat,-.12,.36,0,g);box(.18,.58,.2,darkMat,.12,.36,0,g);
 box(.13,.55,.16,cloth,-.27,1.05,0,g);box(.13,.55,.16,cloth,.27,1.05,0,g);
 g.position.set(x,0,z);scene.add(g);
 pedestrians.push({g,axis,sign,speed:1.05+(colorIndex%4)*.12,walk:Math.random()*6,low:axis==='x'?-108:-108,high:108});
}
for(let i=0;i<12;i++){
 const lane=i%4;
 if(lane===0)makePedestrian(-92+Math.floor(i/4)*31,-10,'x',1,i);
 else if(lane===1)makePedestrian(92-Math.floor(i/4)*31,10,'x',-1,i);
 else if(lane===2)makePedestrian(-10,-92+Math.floor(i/4)*31,'z',1,i);
 else makePedestrian(10,92-Math.floor(i/4)*31,'z',-1,i);
}

// Мини-карта: дороги, автомобили, пешеходы и положение игрока
const mini=document.querySelector('#minimap'),miniCtx=mini.getContext('2d');
function mapPoint(x,z){return {x:120+x*.91,y:120+z*.91}}
function drawMinimap(){
 const c=miniCtx;c.clearRect(0,0,240,240);c.fillStyle='#182735';c.fillRect(0,0,240,240);
 c.strokeStyle='#64717a';c.lineWidth=13;
 for(const z of [0,55]){let a=mapPoint(-115,z),b=mapPoint(115,z);c.beginPath();c.moveTo(a.x,a.y);c.lineTo(b.x,b.y);c.stroke()}
 for(const x of [0,55]){let a=mapPoint(x,-115),b=mapPoint(x,115);c.beginPath();c.moveTo(a.x,a.y);c.lineTo(b.x,b.y);c.stroke()}
 c.strokeStyle='#d4cda7';c.lineWidth=1.2;c.setLineDash([5,6]);
 for(const z of [0,55]){let a=mapPoint(-115,z),b=mapPoint(115,z);c.beginPath();c.moveTo(a.x,a.y);c.lineTo(b.x,b.y);c.stroke()}
 for(const x of [0,55]){let a=mapPoint(x,-115),b=mapPoint(x,115);c.beginPath();c.moveTo(a.x,a.y);c.lineTo(b.x,b.y);c.stroke()}c.setLineDash([]);
 for(const t of traffic){const q=mapPoint(t.g.position.x,t.g.position.z);c.fillStyle='#f2b84b';c.fillRect(q.x-2,q.y-2,4,4)}
 for(const ped of pedestrians){const q=mapPoint(ped.g.position.x,ped.g.position.z);c.fillStyle='#72d69a';c.beginPath();c.arc(q.x,q.y,2.2,0,Math.PI*2);c.fill()}
 const target=inCar?car.position:player.position,q=mapPoint(target.x,target.z);
 c.fillStyle=inCar?'#ffcf55':'#55d9ff';c.strokeStyle='#07131d';c.lineWidth=3;c.beginPath();c.arc(q.x,q.y,6,0,Math.PI*2);c.fill();c.stroke();
 c.fillStyle='#ffffffcc';c.font='bold 11px Arial';c.fillText('N',116,13);
}

const keys={};
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key.toLowerCase()==='e')toggleCar();if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault()});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
function bindHold(el,key){
 const down=e=>{e.preventDefault();keys[key]=true;try{el.setPointerCapture(e.pointerId)}catch(_){}};
 const up=e=>{e.preventDefault();keys[key]=false};
 el.addEventListener('pointerdown',down);['pointerup','pointercancel','lostpointercapture','pointerleave'].forEach(ev=>el.addEventListener(ev,up));
}
document.querySelectorAll('[data-key]').forEach(b=>bindHold(b,b.dataset.key));
document.querySelector('#enterBtn').onclick=toggleCar;
document.querySelector('#jumpBtn').onclick=()=>{if(!inCar&&!player.userData.jumping){player.userData.jumping=true;player.position.y=.85;setTimeout(()=>{player.position.y=0;player.userData.jumping=false},380)}};
function toggleCar(){
 if(!inCar&&player.position.distanceTo(car.position)<5){inCar=true;player.visible=false;speed=0;toast('Ты сел в машину!')}
 else if(inCar){inCar=false;player.visible=true;player.position.copy(car.position).add(new THREE.Vector3(2,0,0));speed=0;toast('Ты вышел из машины')}
 else toast('Подойди ближе к машине');
}
const panel=document.querySelector('#panel'),choices=document.querySelector('#choices'),title=document.querySelector('#panelTitle');
window.closePanel=()=>panel.style.display='none';
window.openPanel=(type)=>{
 panel.style.display='flex';choices.innerHTML='';
 const add=(label,sub,fn)=>{const b=document.createElement('button');b.className='choice';b.innerHTML=label+'<span>'+sub+'</span>';b.onclick=fn;choices.appendChild(b)};
 if(type==='garage'){
  title.textContent='🛠 Гараж и тюнинг';
  add('🚘 Текущая модель',vehicleDefs[selectedVehicle].name,()=>toast(vehicleDefs[selectedVehicle].type));
  [[0xc52c28,'Красный'],[0x2366c7,'Синий'],[0x24945b,'Зелёный'],[0xe4e6e8,'Белый'],[0x17191d,'Чёрный'],[0xd6a52b,'Золотой']].forEach(([c,n])=>add('🎨 '+n,'Цвет кузова',()=>{garage.color=c;applyGarage();toast('Цвет изменён')} ));
  [[0xb8c1ca,'Серебристые'],[0x17191d,'Чёрные'],[0xc79a42,'Золотые']].forEach(([c,n])=>add('🛞 '+n,'Диски',()=>{garage.rim=c;applyGarage();toast('Диски изменены')}));
  add('⬇ Подвеска ниже','Спортивная посадка',()=>{garage.ride=-.45;applyGarage();toast('Подвеска занижена')});
  add('⬆ Подвеска выше','Увеличенный клиренс',()=>{garage.ride=.45;applyGarage();toast('Подвеска поднята')});
  add('💾 Сохранить сборку','Запомнить настройки',saveGarage);return;
 }
 if(type==='cars'){
  title.textContent='🚘 Автопарк — 7 моделей';
  vehicleDefs.forEach((v,i)=>add(v.name,v.type,()=>{selectedVehicle=i;garage.color=v.color;applyGarage();saveGarage();toast(v.name+' выбран')}));
  return;
 }
 if(type==='settings'){
  title.textContent='🎮 Управление и графика';
  add('Экономная графика','Для слабых телефонов',()=>applyQuality('low'));
  add('Высокая графика','Баланс качества и плавности',()=>applyQuality('high'));
  add('Максимальная графика','Для мощных устройств',()=>applyQuality('ultra'));
  add('Полный экран','Развернуть игру',()=>{if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(()=>toast('Полный экран недоступен'));else toast('Браузер не поддерживает полный экран')});
  add('Геймпад','Подключи Bluetooth-геймпад',()=>toast(navigator.getGamepads?'Ожидаю подключение геймпада':'Геймпад не поддерживается'));
  add('Сбросить сохранения','Удалить настройки гаража и графики',()=>{if(confirm('Сбросить сохранённые настройки?')){localStorage.removeItem('gtaWebGarage');localStorage.removeItem('gtaQuality');location.reload()}});
  return;
 }
 const data={maps:['Дневной город','Закат','Ночной город'],skins:['Чёрный спортивный костюм','Красная одежда','Золотая одежда'],mods:['Городской трафик: ВКЛ','Машины: ВКЛ','Смена внешнего вида']}[type];
 title.textContent={maps:'🗺 Выбор карты',skins:'👕 Выбор скина',mods:'⚙ Игровые моды'}[type];
 data.forEach((name,i)=>add(name,'Нажми, чтобы применить',()=>{
  if(type==='maps'){currentMap=i;scene.background.setHex(skyColors[i]);scene.fog.color.setHex(skyColors[i]);sun.intensity=i===2?0.65:2.25;toast(name+' включён')}
  if(type==='skins'){const c=[0x17191d,0xb83232,0xc69b26][i];mats.shirt.color.setHex(c);toast(name+' применён')}
  if(type==='mods')toast(name);
 }));
};

// Gamepad
function pollGamepad(){
 const pads=navigator.getGamepads?navigator.getGamepads():[];const gp=Array.from(pads||[]).find(Boolean);if(!gp)return;
 const ax=gp.axes||[],btn=gp.buttons||[],dead=.22,lx=Math.abs(ax[0]||0)>dead?ax[0]:0,ly=Math.abs(ax[1]||0)>dead?ax[1]:0;
 keys.arrowup=ly<-.25||!!(btn[7]&&btn[7].pressed);keys.arrowdown=ly>.25||!!(btn[6]&&btn[6].pressed);keys.arrowleft=lx<-.25;keys.arrowright=lx>.25;
 if(btn[0]?.pressed&&!pollGamepad.a){pollGamepad.a=true;if(!inCar)document.querySelector('#jumpBtn').click()}if(!btn[0]?.pressed)pollGamepad.a=false;
 if((btn[2]?.pressed||btn[1]?.pressed)&&!pollGamepad.b){pollGamepad.b=true;toggleCar()}if(!btn[2]?.pressed&&!btn[1]?.pressed)pollGamepad.b=false;
}
addEventListener('gamepadconnected',()=>toast('Геймпад подключён'));addEventListener('gamepaddisconnected',()=>toast('Геймпад отключён'));

function update(dt){
 const forward=keys.w||keys.arrowup,back=keys.s||keys.arrowdown,left=keys.a||keys.arrowleft,right=keys.d||keys.arrowright;
 if(inCar){
  if(forward)speed=Math.min(speed+dt*10,22);else if(back)speed=Math.max(speed-dt*14,-8);else speed*=Math.pow(.965,dt*60);
  if(left)car.rotation.y+=dt*(speed>=0?1:-1)*1.65;if(right)car.rotation.y-=dt*(speed>=0?1:-1)*1.65;
  car.position.x+=Math.sin(car.rotation.y)*speed*dt;car.position.z+=Math.cos(car.rotation.y)*speed*dt;
  wheels.forEach(w=>w.rotation.x+=speed*dt*2.5);
  document.querySelector('#speed').style.display='block';document.querySelector('#speed').textContent=Math.round(Math.abs(speed)*4)+' км/ч';
 }else{
  speed=0;document.querySelector('#speed').style.display='none';
  const dx=(right?1:0)-(left?1:0),dz=(back?1:0)-(forward?1:0);
  if(dx||dz){const a=Math.atan2(dx,dz);player.rotation.y=a;const v=7.5*dt;player.position.x+=Math.sin(a)*v;player.position.z+=Math.cos(a)*v}
 }
 for(const t of traffic){if(t.axis==='x'){t.g.position.x+=dt*5*t.sign;if(t.g.position.x>115)t.g.position.x=-115;if(t.g.position.x< -115)t.g.position.x=115}else{t.g.position.z+=dt*5*t.sign;if(t.g.position.z>115)t.g.position.z=-115;if(t.g.position.z< -115)t.g.position.z=115}}
 for(const p of pedestrians){
  p.walk+=dt*7;const step=Math.sin(p.walk)*.09;
  if(p.axis==='x'){p.g.position.x+=dt*p.speed*p.sign;p.g.position.z+=step*.12;if(p.g.position.x>p.high){p.g.position.x=p.low;p.g.position.z+=0}else if(p.g.position.x<p.low){p.g.position.x=p.high}}
  else{p.g.position.z+=dt*p.speed*p.sign;p.g.position.x+=step*.12;if(p.g.position.z>p.high)p.g.position.z=p.low;else if(p.g.position.z<p.low)p.g.position.z=p.high}
  p.g.rotation.y=p.axis==='x'?(p.sign>0?Math.PI/2:-Math.PI/2):(p.sign>0?0:Math.PI);
 }
 drawMinimap();
 const target=inCar?car.position:player.position,angle=inCar?car.rotation.y:player.rotation.y;
 const desired=new THREE.Vector3(target.x-Math.sin(angle)*9,target.y+5.5,target.z-Math.cos(angle)*9);
 camera.position.lerp(desired,Math.min(1,dt*7));camera.lookAt(target.x,target.y+1.2,target.z);
}
applyQuality(quality,false);
let last=performance.now();
function loop(now){const dt=Math.min((now-last)/1000,.04);last=now;pollGamepad();update(dt);renderer.render(scene,camera);requestAnimationFrame(loop)}
requestAnimationFrame(loop);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
toast('Добро пожаловать в GTA Mobile V3.4!');
</script>
