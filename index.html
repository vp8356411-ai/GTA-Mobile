 else{let v=8*dt,dx=(right?1:0)-(left?1:0),dz=(back?1:0)-(forward?1:0);if(dx||dz){let a=Math.atan2(dx,dz);player.rotation.y=a;player.position.x+=Math.sin(a)*v;player.position.z+=Math.cos(a)*v}}let moving = !!(dx || dz);

function update(dt) {
  let forward = keys['w'] || keys['arrowup'];
  let back = keys['s'] || keys['arrowdown'];
  let left = keys['a'] || keys['arrowleft'];
  let right = keys['d'] || keys['arrowright'];

  if (inCar) {
    if (forward) speed = Math.min(speed + dt * 10, 18);
    else if (back) speed = Math.max(speed - dt * 14, -7);
    else speed *= 0.96;

    if (left) car.rotation.y += dt * (speed >= 0 ? 1 : -1) * 1.7;
    if (right) car.rotation.y -= dt * (speed >= 0 ? 1 : -1) * 1.7;

    car.position.x += Math.sin(car.rotation.y) * speed * dt;
    car.position.z += Math.cos(car.rotation.y) * speed * dt;

    wheels.forEach(w => w.rotation.x += speed * dt * 2);
  } else {
    let v = 8 * dt;
    let dx = (right ? 1 : 0) - (left ? 1 : 0);
    let dz = (back ? 1 : 0) - (forward ? 1 : 0);

    if (dx || dz) {
      let a = Math.atan2(dx, dz);
      player.rotation.y = a;
      player.position.x += Math.sin(a) * v;
      player.position.z += Math.cos(a) * v;
    }
  }

  let target = inCar ? car.position : player.position;
  let angle = inCar ? car.rotation.y : player.rotation.y;

  let desired = new THREE.Vector3(
    target.x - Math.sin(angle) * 9,
    target.y + 5.5,
    target.z - Math.cos(angle) * 9
  );

  camera.position.lerp(desired, 0.09);
  camera.lookAt(target.x, target.y + 1.2, target.z);
}
window.addEventListener('gamepadconnected',()=>toast('Геймпад подключён'));window.addEventListener('gamepaddisconnected',()=>toast('Геймпад отключён'));
applyQuality(quality);
let last=performance.now(),frameCount=0;function loop(now){let dt=Math.min((now-last)/1000,.04);last=now;pollGamepad();update(dt);renderer.render(scene,camera);requestAnimationFrame(loop)}requestAnimationFrame(loop);
